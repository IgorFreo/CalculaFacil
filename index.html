<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalculaFácil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>CalculaFácil</h1>
    <p>Bem-vindo, Professor! Escolha uma calculadora para começar.</p>

    <section>
        <h2>Calculadora de IMC</h2>
        <p>Descubra seu Índice de Massa Corporal.</p>

        <label for="peso">Seu peso (kg):</label>
        <input type="number" id="peso" step="0.1">

        <br><br>

        <label for="altura">Sua altura (m):</label>
        <input type="number" id="altura" step="0.01">

        <br><br>

        <button id="btnCalcular">Calcular IMC</button>

        <p id="resultado"></p>
    </section>

    <section>
        <h2>Calculadora de TMB</h2>
        <p>Descubra sua Taxa Metabólica Basal.</p>

        <label for="idade">Sua idade (anos):</label>
        <input type="number" id="idade">

        <br><br>

        <label for="pesoTMB">Seu peso (kg):</label>
        <input type="number" id="pesoTMB">

        <br><br>

        <label for="alturaTMB">Sua altura (cm):</label>
        <input type="number" id="alturaTMB">

        <p>Seu sexo é:</p>
        <input type="radio" id="masculino" name="sexo" value="masculino">
        <label for="masculino">Masculino</label>

        <br><br>

        <input type="radio" id="feminino" name="sexo" value="feminino">
        <label for="feminino">Feminino</label>

        <br><br>

        <button id="btnCalcularTMB">Calcular TMB</button>
        
        <p id="resultadoTMB"></p>

    </section>

    <section>
        <h2>Calculadora de Salário Líquido</h2>
        <p>Descubra qual é o seu Salário Líquido.</p>

        <label for="salario">Seu Salário Bruto (R$):</label>
        <input type="number" id="salario" step="0.01">

        <br><br>

        <label for="descontos">Total de descontos (R$):</label>
        <input type="number" id="descontos" step="0.01">

        <br><br>

        <button id="btnCalcularSalario">Calcular Salário Líquido</button>
        <p id="resultadoSalario"></p>
    
    
    </section>

    <script src="script.js"></script>
</body>
</html>
